services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mu_realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Solo accesible desde el propio equipo/servidor; nunca publicar PostgreSQL a internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mu_realestate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mu_realestate
      STORAGE_DIR: /app/storage
    # Las fotos subidas viven en un volumen: sobreviven a reconstruir o actualizar el contenedor.
    volumes:
      - archivos:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  archivos:
