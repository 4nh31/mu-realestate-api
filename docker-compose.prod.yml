# Despliegue en el VPS (ver DESPLIEGUE.md).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Solo el contenedor "web" (Caddy) se publica a internet, en los puertos 80 y 443.
# La API y PostgreSQL quedan en la red interna de Docker.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mu_realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mu_realestate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/mu_realestate
      STORAGE_DIR: /app/storage
    # Detrás de Caddy: respeta los encabezados X-Forwarded-* para conocer el esquema (https) y la IP real.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - archivos:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    # Carpeta donde está clonado el repositorio del front (por defecto, al lado de este).
    build: ${FRONT_DIR:-../Front_MuRealEstate}
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en .env}
      API_UPSTREAM: api:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  archivos:
  caddy_data:
  caddy_config:
